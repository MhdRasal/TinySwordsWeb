// Canvas size manager: Enforces pristine 16:9 aspect ratio so buttons and headers never get cut off
function fitCanvasToScreen() {
	const canvas = document.getElementById('canvas');
	if (!canvas) return;

	const targetRatio = 16 / 9; // 1280x720 base design
	const winW = window.innerWidth;
	const winH = window.innerHeight;
	const winRatio = winW / winH;

	let w, h;
	if (winRatio > targetRatio) {
		// Screen is wider than 16:9 (e.g. mobile 20:9 or ultrawide desktop)
		h = winH;
		w = Math.floor(winH * targetRatio);
	} else {
		// Screen is taller than 16:9
		w = winW;
		h = Math.floor(winW / targetRatio);
	}

	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	canvas.width = Math.floor(w * dpr);
	canvas.height = Math.floor(h * dpr);
	canvas.style.width = w + 'px';
	canvas.style.height = h + 'px';
}

fitCanvasToScreen();
window.addEventListener('resize', fitCanvasToScreen);
window.addEventListener('orientationchange', fitCanvasToScreen);

// canvasResizePolicy: 0 allows our fitCanvasToScreen function to strictly preserve 16:9 without Godot cropping buttons
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"TinySwords","experimentalVK":false,"fileSizes":{"TinySwords.pck":36765108,"TinySwords.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const fsBtn = document.getElementById('fullscreen-btn');

	const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
	if (isTouch) {
		fsBtn.style.display = 'block';
	}

	function toggleFullScreen() {
		const doc = window.document;
		const docEl = doc.documentElement;
		const requestFullscreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
		const exitFullscreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

		if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
			if (requestFullscreen) {
				requestFullscreen.call(docEl).then(() => {
					fitCanvasToScreen();
					if (screen.orientation && screen.orientation.lock) {
						screen.orientation.lock('landscape').catch(() => {});
					}
				}).catch(() => {});
			}
			fsBtn.innerText = '✕ Exit';
		} else {
			if (exitFullscreen) {
				exitFullscreen.call(doc);
			}
			fsBtn.innerText = '⛶ Fullscreen';
		}
	}

	fsBtn.addEventListener('click', toggleFullScreen);

	window.addEventListener('touchstart', function () {
		if (screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('landscape').catch(() => {});
		}
	}, { once: true, passive: true });

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			fitCanvasToScreen();
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
